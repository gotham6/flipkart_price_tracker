name: Flipkart Price Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: flipkart-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore saved tracker state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          state_dir="$(mktemp -d)"
          echo "STATE_DIR=$state_dir" >> "$GITHUB_ENV"

          if git ls-remote --exit-code --heads origin tracker-state >/dev/null 2>&1; then
            git clone --branch tracker-state --single-branch \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$state_dir"

            if [ -f "$state_dir/state.json" ]; then
              cp "$state_dir/state.json" state.json
            fi
          else
            git clone --no-checkout \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$state_dir"

            cd "$state_dir"
            git switch --orphan tracker-state
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            printf "# Tracker state\n" > README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Initialize tracker state branch"
            git push origin tracker-state
          fi

      - name: Run hourly price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check

      - name: Save updated tracker state
        env:
          STATE_DIR: ${{ env.STATE_DIR }}
        run: |
          set -euo pipefail

          if [ ! -d "$STATE_DIR/.git" ]; then
            echo "Missing state branch checkout."
            exit 1
          fi

          cp state.json "$STATE_DIR/state.json"

          cd "$STATE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update tracker state"
          git push origin tracker-state
